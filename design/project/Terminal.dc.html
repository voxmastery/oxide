<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=JetBrains+Mono:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
<script src="oxide-lib.js"></script>
<style>body{margin:0}a{color:#FF8A55}a:hover{color:#FFA070}@keyframes ox-spin{to{transform:rotate(360deg)}}@keyframes ox-pulse{0%,100%{opacity:1}50%{opacity:.3}}input::placeholder{color:#6E6862}</style>
</helmet>
<div style="height:100%;display:flex;flex-direction:column;background:#0F0E0E;font-family:'Public Sans',sans-serif;color:#ECE8E3;position:relative;overflow:hidden">
  <div style="height:64px;flex:none;display:flex;align-items:center;gap:2px;padding:4px 6px 0 6px">
    <sc-if value="{{ head.back }}" hint-placeholder-val="{{ false }}"><button onClick="{{ goBack }}" style="width:48px;height:48px;flex:none;border:0;background:none;border-radius:24px;color:#ECE8E3;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,0.06)"><span style="font:24px/1 'Material Symbols Outlined';width:24px;height:24px;overflow:hidden">arrow_back</span></button></sc-if>
    <button onClick="{{ openSheet }}" style="flex:1;min-width:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 10px;border:0;border-radius:16px;background:none;color:#ECE8E3;cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,0.04)">
      <div style="width:36px;height:36px;flex:none;border-radius:11px;background:#1E1C1B;display:flex;align-items:center;justify-content:center"><span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;overflow:hidden;color:#FF8A55">{{ head.icon }}</span></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
        <div style="display:flex;align-items:center;gap:2px;min-width:0"><span style="font:600 16px 'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ head.name }}</span><span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;flex:none;overflow:hidden;color:#8C867F">expand_more</span></div>
        <span style="font:400 11.5px 'JetBrains Mono',monospace;color:#8C867F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ head.path }}</span>
      </div>
    </button>
    <button onClick="{{ clear }}" title="Clear the screen" style="width:48px;height:48px;flex:none;border:0;background:none;border-radius:24px;color:#D9D3CC;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,0.06)"><span style="font:24px/1 'Material Symbols Outlined';width:24px;height:24px;overflow:hidden">clear_all</span></button>
  </div>

  <sc-if value="{{ mission.on }}" hint-placeholder-val="{{ false }}">
    <div style="flex:none;margin:2px 12px 10px;padding:12px 14px 14px;border-radius:18px;background:#1A1918;box-shadow:inset 0 0 0 1px {{ mission.bd }};display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px;min-height:20px">
        <span style="flex:1;font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:0.08em;color:{{ mission.kc }}">{{ mission.kicker }}</span>
        <sc-if value="{{ mission.done }}" hint-placeholder-val="{{ false }}"><button onClick="{{ goHome }}" style="height:40px;margin:-10px -6px -10px 0;padding:0 6px 0 12px;border:0;border-radius:20px;background:none;color:#57D6C8;font:600 13.5px 'Public Sans',sans-serif;display:flex;align-items:center;gap:2px;cursor:pointer">Home<span style="font:18px/1 'Material Symbols Outlined';width:18px;height:18px;overflow:hidden">chevron_right</span></button></sc-if>
      </div>
      <span style="font-size:15.5px;line-height:1.3;font-weight:600">{{ mission.title }}</span>
      <span style="font-size:13px;line-height:1.45;color:#A39C95;text-wrap:pretty">{{ mission.sub }}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:2px">
        <sc-for list="{{ mission.steps }}" as="s" hint-placeholder-count="3"><span style="height:26px;padding:0 9px 0 6px;border-radius:8px;background:{{ s.bg }};display:flex;align-items:center;gap:5px;font:500 11.5px 'JetBrains Mono',monospace;color:{{ s.c }};white-space:nowrap"><span style="font:16px/1 'Material Symbols Outlined';width:16px;height:16px;overflow:hidden;font-variation-settings:{{ s.fill }}">{{ s.icon }}</span>{{ s.t }}</span></sc-for>
      </div>
    </div>
  </sc-if>

  <div ref="{{ scRef }}" style="flex:1;min-height:0;overflow-y:auto;position:relative;scrollbar-width:none;box-shadow:inset 0 1px 0 #1C1A19">
    <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="2">
      <div data-blk="{{ b.id }}" style="padding:12px 16px 14px;box-shadow:inset 0 -1px 0 #1C1A19;display:flex;flex-direction:column;gap:8px">
        <sc-if value="{{ b.hasCmd }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;align-items:center;gap:8px;min-height:20px">
            <span style="font:600 13.5px 'JetBrains Mono',monospace;color:#FF8A55">$</span>
            <span style="flex:1;min-width:0;font:500 13.5px 'JetBrains Mono',monospace;color:#ECE8E3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.cmd }}</span>
            {{ b.spin }}
            <span style="font:500 11.5px 'JetBrains Mono',monospace;color:{{ b.mc }};white-space:nowrap">{{ b.meta }}</span>
            <button onClick="{{ b.menu }}" title="More" style="width:40px;height:40px;margin:-10px -12px -10px -4px;flex:none;border:0;border-radius:20px;background:none;color:#6E6862;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,0.05)"><span style="font:18px/1 'Material Symbols Outlined';width:18px;height:18px;overflow:hidden">more_vert</span></button>
          </div>
        </sc-if>
        <sc-if value="{{ b.hasOut }}" hint-placeholder-val="{{ false }}">
          <div style="overflow-x:auto;scrollbar-width:none;font:400 12px/18px 'JetBrains Mono',monospace;font-variant-ligatures:none;color:#E4E0DB">
            <sc-for list="{{ b.lines }}" as="l"><div style="white-space:{{ l.ws }};width:{{ l.w }};min-height:18px;overflow-wrap:anywhere"><sc-for list="{{ l.segs }}" as="sg"><span style="{{ sg.s }}">{{ sg.t }}</span></sc-for></div></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ b.hasActs }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:2px">
            <sc-for list="{{ b.acts }}" as="a"><button onClick="{{ a.onTap }}" style="height:40px;padding:0 14px 0 10px;border:0;border-radius:12px;background:#1E1C1B;box-shadow:inset 0 0 0 1px #2E2C2A;color:#ECE8E3;font:600 13px 'Public Sans',sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap" style-hover="background:#262422"><span style="font:18px/1 'Material Symbols Outlined';width:18px;height:18px;overflow:hidden;color:{{ a.ic }}">{{ a.icon }}</span>{{ a.label }}</button></sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding:32px 24px;font:400 12.5px/1.6 'JetBrains Mono',monospace;color:#6E6862;text-align:center">Screen cleared. Your history is still on ↑.</div></sc-if>
  </div>

  <div style="flex:none;background:#141312;box-shadow:inset 0 1px 0 #24221F;display:flex;flex-direction:column;gap:4px;padding:4px 0 10px">
    <sc-if value="{{ procRow.on }}" hint-placeholder-val="{{ false }}">
      <div style="height:44px;display:flex;align-items:center;gap:10px;padding:0 8px 0 18px">
        {{ procRow.pulse }}
        <span style="flex:1;min-width:0;font:500 12.5px 'JetBrains Mono',monospace;color:#D9D3CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ procRow.text }}</span>
        <button onMouseDown="{{ keep }}" onClick="{{ ctrlC }}" style="height:36px;padding:0 12px;border:0;border-radius:10px;background:#2A2826;color:#ECE8E3;font:600 12.5px 'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap" style-hover="background:#34312E">Stop ⌃C</button>
      </div>
    </sc-if>
    <sc-if value="{{ chipsOn }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><button onMouseDown="{{ keep }}" onClick="{{ c.onTap }}" style="flex:none;height:44px;padding:4px 0;border:0;background:none;cursor:pointer"><span style="height:36px;padding:0 12px;border-radius:10px;background:{{ c.bg }};box-shadow:inset 0 0 0 1px {{ c.bd }};color:{{ c.c }};font:500 12.5px 'JetBrains Mono',monospace;display:flex;align-items:center;white-space:nowrap">{{ c.t }}</span></button></sc-for>
      </div>
    </sc-if>
    <div style="margin:0 12px;height:52px;border-radius:14px;background:#1E1C1B;box-shadow:inset 0 0 0 {{ inp.bw }} {{ inp.bc }};display:flex;align-items:center;gap:10px;padding:0 6px 0 14px">
      <span style="font:600 15px 'JetBrains Mono',monospace;color:{{ inp.pc }}">{{ inp.prompt }}</span>
      <input ref="{{ inRef }}" value="{{ input }}" onChange="{{ onInput }}" onKeyDown="{{ onKey }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" placeholder="{{ inp.ph }}" autoCapitalize="off" autoComplete="off" autoCorrect="off" spellCheck="false" style="flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;color:#ECE8E3;font:400 15px 'JetBrains Mono',monospace;caret-color:#F74C00;padding:0">
      <button onMouseDown="{{ keep }}" onClick="{{ submit }}" title="Run" style="width:40px;height:40px;flex:none;border:0;border-radius:11px;background:{{ inp.sb }};color:{{ inp.sc }};display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;overflow:hidden">keyboard_return</span></button>
    </div>
    <sc-if value="{{ focus }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 10px 0">
        <sc-for list="{{ keys }}" as="x"><button onMouseDown="{{ keep }}" onClick="{{ x.onTap }}" style="flex:none;min-width:44px;height:44px;padding:0 10px;border:0;border-radius:10px;background:#1E1C1B;color:#D9D3CC;font:500 14px 'JetBrains Mono',monospace;cursor:pointer" style-hover="background:#262422">{{ x.t }}</button></sc-for>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ sheet.on }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,9,9,0.62);z-index:10"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:86%;overflow-y:auto;scrollbar-width:none;background:#1A1918;border-radius:28px 28px 0 0;box-shadow:0 -1px 0 rgba(255,255,255,0.06);display:flex;flex-direction:column;padding:0 0 16px">
      <div style="height:28px;flex:none;display:flex;align-items:center;justify-content:center"><div style="width:32px;height:4px;border-radius:2px;background:#4A4643"></div></div>
      <div style="display:flex;align-items:center;padding:0 12px 8px 24px">
        <span style="flex:1;font-size:20px;font-weight:650;letter-spacing:-0.01em">Projects</span>
        <button onClick="{{ newProject }}" style="height:44px;padding:0 16px 0 12px;border:0;border-radius:22px;background:#2A2826;color:#ECE8E3;font:600 14px 'Public Sans',sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer" style-hover="background:#34312E"><span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;overflow:hidden">add</span>New project</button>
      </div>
      <sc-for list="{{ sheet.rows }}" as="r" hint-placeholder-count="4">
        <button onClick="{{ r.onTap }}" style="min-height:64px;display:flex;align-items:center;gap:14px;padding:8px 20px 8px 24px;border:0;background:{{ r.bg }};color:#ECE8E3;cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,0.04)">
          <span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;flex:none;overflow:hidden;color:{{ r.ic }}">{{ r.icon }}</span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="font:500 15px 'JetBrains Mono',monospace;color:{{ r.tc }}">{{ r.name }}</span>
            <span style="font-size:12.5px;color:#8C867F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.sub }}</span>
          </div>
          <span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;overflow:hidden;color:#FF8A55">{{ r.mark }}</span>
        </button>
      </sc-for>
      <sc-if value="{{ sheet.hasBook }}" hint-placeholder-val="{{ false }}">
        <span style="padding:14px 24px 6px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:0.09em;color:#A39C95">FROM THE BOOK</span>
        <sc-for list="{{ sheet.book }}" as="r">
          <button onClick="{{ r.onTap }}" style="min-height:64px;display:flex;align-items:center;gap:14px;padding:8px 20px 8px 24px;border:0;background:none;color:#ECE8E3;cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,0.04)">
            <span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;flex:none;overflow:hidden;color:#8C867F">folder_code</span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
              <span style="font:500 15px 'JetBrains Mono',monospace;color:#D9D3CC">{{ r.name }}</span>
              <span style="font-size:12.5px;color:#8C867F">{{ r.sub }}</span>
            </div>
            <span style="font:500 12px 'JetBrains Mono',monospace;color:#8C867F;white-space:nowrap">cargo new</span>
          </button>
        </sc-for>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  scRef = React.createRef();
  inRef = React.createRef();
  _id = 0;
  _tm = [];
  state = { ready: !!window.OxLib, fs: null, cwd: '~', blocks: [], proc: null, mis: null, input: '', hist: [], hi: -1, focus: false, sheet: this.props.variant === 'projects' };
  fresh() { return this.props.fresh === true || this.props.fresh === 'true'; }
  componentDidMount() {
    if (window.OxLib) this.start();
    else { this._h = () => { this.setState({ ready: true }); this.start(); }; window.addEventListener('oxlib-ready', this._h); }
  }
  start() {
    const C = this.props.sid && window.__oxTerm && window.__oxTerm[this.props.sid];
    if (!C) return this.boot();
    const pend = C.pending || (this.props.variant === 'cmd' && this.props.arg) || null, st = C.st;
    C.pending = null; this._id = C._id;
    const blocks = st.blocks.map(b => b.st === 'run' && !(st.proc && st.proc.id === b.id) ? Object.assign({}, b, { st: 'err', code: 130, lines: b.lines.concat(['^C']) }) : b);
    this.setState(Object.assign({}, st, { blocks, sheet: false, input: '', focus: false }), () => { this.scroll(); this.runCmds(pend); });
  }
  runCmds(c) {
    if (!c) return;
    if (this.state.proc) this.ctrlC();
    (Array.isArray(c) ? c : String(c).split(' && ')).forEach((x, i) => this.later(250 + i * 650, () => this.exec(x)));
  }
  componentWillUnmount() {
    this._tm.forEach(clearTimeout); if (this._h) window.removeEventListener('oxlib-ready', this._h);
    if (this.props.sid && this.state.fs) { const W = window.__oxTerm = window.__oxTerm || {}; W[this.props.sid] = { st: this.state, _id: this._id, pending: null }; }
  }
  componentDidUpdate(pp, ps) { if (ps.blocks !== this.state.blocks) this.scroll(); }
  scroll() {
    requestAnimationFrame(() => {
      const el = this.scRef.current, B = this.state.blocks;
      if (!el || !B.length) return;
      const last = el.querySelector('[data-blk="' + B[B.length - 1].id + '"]'), max = el.scrollHeight - el.clientHeight;
      el.scrollTop = this.state.proc || !last ? max : Math.min(max, last.offsetTop - 4);
    });
  }
  st(w) { return '§G' + w.padStart(12) + '§n'; }
  finished(prof, t) { return this.st('Finished') + ' `' + prof + '` profile [unoptimized + debuginfo] target(s) in ' + t; }
  newOut(n) { return [this.st('Creating') + ' binary (application) `' + n + '` package', { t: '§Cnote§n: see more `Cargo.toml` keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html', w: 1 }]; }
  gameLines(partial) {
    const g = [this.finished('dev', '0.03s'), this.st('Running') + ' `target/debug/guessing_game`', 'Guess the number!', 'Please input your guess.'];
    const turns = [[50, 'Too small!'], [75, 'Too big!'], [62, 'Too small!']].concat(partial ? [] : [[68, 'You win!']]);
    turns.forEach(([n, r]) => { g.push('§W' + n, 'You guessed: ' + n, r); if (r !== 'You win!') g.push('Please input your guess.'); });
    return g;
  }
  boot() {
    const L = window.OxLib, v = this.props.variant || '', fresh = this.fresh(), day1 = v === 'day1' || v === 'first' || (fresh && !v), R = L.RUST;
    const fs = this.fs0(day1 || fresh), Pst = window.__oxP && window.__oxP[this.props.sid];
    if (Pst) {
      Object.keys(Pst.deleted).forEach(n => this.rmProj(fs, n));
      Object.keys(Pst.files).forEach(n => { const r = '~/projects/' + n, F = Pst.files[n]; if (!fs[r]) return; if (F['src/main.rs'] != null && fs[r + '/src']) fs[r + '/src'].f['main.rs'] = F['src/main.rs']; if (F['Cargo.toml'] != null) fs[r].f['Cargo.toml'] = F['Cargo.toml']; });
    }
    const B = (cmd, lines, o) => Object.assign({ id: ++this._id, cmd, lines, st: 'ok', code: 0, dur: '' }, o || {});
    let cwd = fresh ? '~/projects' : '~/projects/guessing_game', blocks = [], proc = null, mis = null;
    if (day1) {
      cwd = '~/projects'; mis = { new: false, cd: false, run: false, name: 'hello_world' };
      blocks.push(B('', ['§dOxide terminal · rustc ' + R.ver + ' · cargo ' + R.ver, { t: '§dYour projects live in §n~/projects§d. Type §nhelp§d to see what works here.', w: 1 }]));
      if (v === 'first') {
        this.mk(fs, '~/projects/hello_world', L.HELLO_RS, L.newToml('hello_world'), true);
        cwd = '~/projects/hello_world'; mis = { new: true, cd: true, run: true, name: 'hello_world' };
        blocks.push(B('cargo new hello_world', this.newOut('hello_world'), { dur: '0.1s' }), B('cd hello_world', []), B('cargo run', [this.st('Compiling') + ' hello_world v0.1.0 (/data/oxide/projects/hello_world)', this.finished('dev', '0.48s'), this.st('Running') + ' `target/debug/hello_world`', 'Hello, world!'], { dur: '0.48s' }));
      }
    } else if (v === 'error' || v === 'explain') {
      cwd = '~/rustlings';
      const code = String(this.props.arg || '').toUpperCase();
      if (!(v === 'explain' && L.ERRS[code])) blocks.push(B('rustlings run move_semantics2', L.EX.move_semantics2.results.E0382.out, { st: 'err', code: 1, err: 'E0382', ex: 'move_semantics2', dur: '0.6s' }));
      if (v === 'explain') { const c = L.ERRS[code] ? code : 'E0382'; blocks.push(B('rustc --explain ' + c, this.explainLines(L.ERRS[c]), { explain: c })); }
    } else if (v !== 'cmd') {
      const game = v === 'game';
      blocks.push(B('ls', [{ t: 'Cargo.lock  Cargo.toml  §Bsrc§n  §Btarget§n', w: 1 }]), B('cargo run', this.gameLines(game), game ? { st: 'run' } : { dur: '41s' }));
      if (game) proc = { id: blocks[1].id, kind: 'guess', secret: 68, name: 'guessing_game', t0: Date.now() - 26000 };
    }
    if (!fs[cwd]) cwd = '~/projects';
    this.setState({ fs, cwd, blocks, proc, mis }, () => { this.scroll(); if (v === 'cmd' && this.props.arg) this.runCmds(this.props.arg); });
  }
  fs0(empty) {
    const L = window.OxLib, fs = {
      '~': { d: ['projects', 'rustlings'], f: {} },
      '~/projects': { d: [], f: {} },
      '~/rustlings': { d: ['exercises', 'solutions'], f: { 'Cargo.toml': '[package]\nname = "exercises"\nversion = "0.1.0"\nedition = "2024"\npublish = false' }, rl: true },
      '~/rustlings/exercises': { d: [], f: { 'README.md': '' } },
      '~/rustlings/solutions': { d: [], f: {} }
    };
    L.RL.path.forEach(p => {
      if (p.t !== 'topic') return;
      fs['~/rustlings/exercises'].d.push(p.dir);
      const f = {}; for (let j = 1; j <= p.n; j++) f[(p.ex || p.name) + j + '.rs'] = '';
      fs['~/rustlings/exercises/' + p.dir] = { d: [], f };
    });
    fs['~/rustlings/exercises'].d.push('quizzes');
    fs['~/rustlings/exercises/quizzes'] = { d: [], f: { 'quiz1.rs': '', 'quiz2.rs': '', 'quiz3.rs': '' } };
    Object.keys(L.EX).forEach(k => { const ex = L.EX[k]; if (!ex.rl || !ex.file) return; const i = ex.file.lastIndexOf('/'), dir = fs['~/rustlings/' + ex.file.slice(0, i)]; if (dir) dir.f[ex.file.slice(i + 1)] = ex.code; });
    if (!empty) { this.mk(fs, '~/projects/guessing_game', L.GUESS.main, L.GUESS.toml, true, L.GUESS.lock); this.mk(fs, '~/projects/hello_world', L.HELLO_RS, L.newToml('hello_world'), true); }
    return fs;
  }
  rmProj(fs, n) { const r = '~/projects/' + n; Object.keys(fs).forEach(p => { if (p === r || p.indexOf(r + '/') === 0) delete fs[p]; }); if (fs['~/projects']) fs['~/projects'].d = fs['~/projects'].d.filter(x => x !== n); }
  mk(fs, p, main, toml, built, lock) {

    if (!L || !S.fs) return Object.assign(base, { head: { name: '', path: '', icon: 'terminal', back: false }, mission: { on: false, steps: [] }, blocks: [], empty: false, procRow: { on: false }, chipsOn: false, chips: [], inp: { prompt: '$', pc: '#FF8A55', ph: 'Type a command', bw: '1px', bc: '#2E2C2A', sb: '#262422', sc: '#6E6862' }, sheet: { on: false, rows: [], book: [], hasBook: false } });
    const blocks = S.blocks.map(b => {
      const run = b.st === 'run', isProc = !!(S.proc && S.proc.id === b.id);
      const lines = b.lines.map((l, j) => {
        const wrap = typeof l === 'object' && !!l.w;
        return { k: j, segs: typeof l === 'string' ? L.ansi(l) : l.segs ? l.segs : L.ansi(l.t), ws: wrap ? 'pre-wrap' : 'pre', w: wrap ? 'auto' : 'max-content' };
      });
      const acts = [];
      if (b.err && L.ERRS[b.err]) acts.push({ k: 'x', icon: 'help', ic: '#FF8F98', label: 'Explain ' + b.err, onTap: () => this.exec('rustc --explain ' + b.err) });
      if (b.ex) acts.push({ k: 'e', icon: 'data_object', ic: '#57D6C8', label: 'Open ' + b.ex, onTap: () => this.props.nav && this.props.nav('workspace', { arg: b.ex }) });
      if (b.explain && L.ERRS[b.explain].sec === '4.2') acts.push({ k: 'r', icon: 'menu_book', ic: '#FF8A55', label: 'Read 4.2', onTap: () => this.props.nav && this.props.nav('reader', { variant: 'resume' }) });
      if (b.practice) acts.push({ k: 'p', icon: 'data_object', ic: '#57D6C8', label: 'Open Practice', onTap: () => this.props.tab && this.props.tab('practice') });
      return {
        k: b.id, id: b.id, cmd: b.cmd, hasCmd: !!b.cmd, lines, hasOut: lines.length > 0, acts, hasActs: acts.length > 0,
        menu: () => this.props.pop && this.props.pop('block', { cmd: b.cmd, meta: b.st === 'err' ? 'exit ' + b.code : (b.dur || S.cwd), out: b.lines.map(l => typeof l === 'string' ? l : l.t != null ? l.t : (l.segs || []).map(s => s.t).join('')).join('\n').replace(/§./g, ''), onRerun: () => this.exec(b.cmd) }),
        spin: run && !isProc ? L.FX.spin(R, '#FF8A55', 13, 2) : null,
        meta: isProc ? 'running' : run ? '' : b.st === 'err' ? 'exit ' + b.code : b.dur, mc: b.st === 'err' ? '#FF8F98' : isProc ? '#FF8A55' : '#8C867F'
      };
    });
    const cwd = S.cwd, root = this.root();
    const head = { name: cwd === '~' ? '~' : cwd.slice(cwd.lastIndexOf('/') + 1), path: cwd === '~' ? '/data/oxide' : cwd, icon: cwd.startsWith('~/rustlings') ? 'data_object' : root ? 'folder_open' : 'terminal', back: Number(this.props.depth) > 1 };
    const m = S.mis, md = !!(m && m.new && m.cd && m.run);
    const mission = m ? {
      on: true, done: md, kicker: md ? 'MISSION COMPLETE · +60 XP' : 'TODAY’S MISSION · STEP 3 OF 3', kc: md ? '#57D6C8' : '#A39C95', bd: md ? 'rgba(87,214,200,0.32)' : 'rgba(255,255,255,0.05)',
      title: md ? 'You ran your first Rust program.' : 'Make a Cargo project and run it',
      sub: md ? 'Tomorrow, 1.3 Hello, Cargo! explains what Cargo just did.' : 'Cargo is Rust’s build tool. It makes a project with a Hello, world! program already in it.',
      steps: [['cargo new ' + m.name, m.new], ['cd ' + m.name, m.cd], ['cargo run', m.run]].map(([t, ok], i) => ({ k: i, t, icon: ok ? 'check_circle' : 'radio_button_unchecked', fill: ok ? "'FILL' 1" : "'FILL' 0", c: ok ? '#57D6C8' : '#B3ACA5', bg: ok ? 'rgba(87,214,200,0.1)' : '#211F1E' }))
    } : { on: false, steps: [] };
    const procRow = S.proc ? { on: true, text: S.proc.name + ' is waiting for input', pulse: R.createElement('span', { style: { width: '8px', height: '8px', borderRadius: '4px', background: '#57D6C8', flex: 'none', animation: 'ox-pulse 1.2s ease-in-out infinite' } }) } : { on: false };
    const has = S.input.trim().length > 0 || !!S.proc;
    const inp = { prompt: S.proc ? '›' : '$', pc: S.proc ? '#57D6C8' : '#FF8A55', ph: S.proc ? 'Type a number, then Enter' : 'Type a command', bw: S.focus ? '1.5px' : '1px', bc: S.focus ? '#F74C00' : '#2E2C2A', sb: has ? '#F74C00' : '#262422', sc: has ? '#1A0B04' : '#6E6862' };
    return Object.assign(base, { head, mission, blocks, empty: blocks.length === 0, procRow, chipsOn: !S.proc, chips: this.chips(), inp, sheet: this.sheetRows() });
  }
}
</script>
