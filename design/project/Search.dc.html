<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=JetBrains+Mono:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
<script src="oxide-lib.js"></script>
<style>body{margin:0}a{color:#FF8A55}a:hover{color:#FFA070}input::placeholder{color:#8C867F}</style>
</helmet>
<div style="height:100%;display:flex;flex-direction:column;background:#0F0E0E;font-family:'Public Sans',sans-serif;color:#ECE8E3">
  <div style="height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:4px 12px 0 4px">
    <button onClick="{{ goBack }}" style="width:48px;height:48px;flex:none;border:0;background:none;border-radius:24px;color:#ECE8E3;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,0.06)"><span style="font:24px/1 'Material Symbols Outlined';width:24px;height:24px;overflow:hidden">arrow_back</span></button>
    <div style="flex:1;min-width:0;height:48px;border-radius:24px;background:#1E1C1B;display:flex;align-items:center;gap:8px;padding:0 4px 0 14px">
      <span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;flex:none;overflow:hidden;color:#A39C95">search</span>
      <input ref="{{ inRef }}" value="{{ q }}" onChange="{{ onQ }}" placeholder="The Book, Rustlings, errors" autoComplete="off" spellCheck="false" style="flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;color:#ECE8E3;font:400 15.5px 'Public Sans',sans-serif;caret-color:#F74C00;padding:0">
      <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}"><button onClick="{{ clearQ }}" title="Clear" style="width:40px;height:40px;flex:none;border:0;border-radius:20px;background:none;color:#A39C95;cursor:pointer;display:flex;align-items:center;justify-content:center"><span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;overflow:hidden">close</span></button></sc-if>
    </div>
  </div>
  <div style="flex:none;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 6px">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4"><button onClick="{{ f.pick }}" style="flex:none;height:44px;padding:4px 0;border:0;background:none;cursor:pointer"><span style="height:34px;padding:0 14px;border-radius:17px;background:{{ f.bg }};box-shadow:inset 0 0 0 1px {{ f.bd }};color:{{ f.c }};font:600 13px 'Public Sans',sans-serif;display:flex;align-items:center;gap:6px;white-space:nowrap">{{ f.t }}<span style="font:500 11.5px 'JetBrains Mono',monospace;color:{{ f.nc }}">{{ f.n }}</span></span></button></sc-for>
  </div>
  <div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:24px">
    <sc-if value="{{ idle }}" hint-placeholder-val="{{ false }}">
      <div style="padding:14px 20px;display:flex;flex-direction:column;gap:12px">
        <span style="font:500 11px 'JetBrains Mono',monospace;letter-spacing:0.09em;color:#A39C95">RECENT</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ recent }}" as="r" hint-placeholder-count="5"><button onClick="{{ r.pick }}" style="height:44px;padding:0 14px 0 10px;border:0;border-radius:12px;background:#1A1918;color:#D9D3CC;font:500 13.5px 'JetBrains Mono',monospace;display:flex;align-items:center;gap:8px;cursor:pointer" style-hover="background:#211F1E"><span style="font:18px/1 'Material Symbols Outlined';width:18px;height:18px;overflow:hidden;color:#8C867F">history</span>{{ r.t }}</button></sc-for></div>
        <p style="margin:8px 0 0;font-size:14px;line-height:1.5;color:#8C867F;text-wrap:pretty">Search section titles in the Book, Rustlings exercises and the compiler’s error index.</p>
      </div>
    </sc-if>
    <sc-if value="{{ none }}" hint-placeholder-val="{{ false }}">
      <div style="padding:56px 32px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
        <span style="font:32px/1 'Material Symbols Outlined';width:32px;height:32px;overflow:hidden;color:#6E6862">search_off</span>
        <span style="font-size:15.5px;font-weight:600">No matches for “{{ q }}”</span>
        <span style="max-width:260px;font-size:13.5px;line-height:1.5;color:#A39C95;text-wrap:pretty">Try a word from a section title, an exercise name or an error code like E0382.</span>
      </div>
    </sc-if>
    <sc-for list="{{ groups }}" as="g">
      <div style="display:flex;flex-direction:column;padding:6px 8px 2px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 6px"><span style="font:500 11px 'JetBrains Mono',monospace;letter-spacing:0.09em;color:#A39C95">{{ g.t }}</span><span style="font:500 12px 'JetBrains Mono',monospace;color:#8C867F">{{ g.n }}</span></div>
        <sc-for list="{{ g.rows }}" as="r">
          <button onClick="{{ r.go }}" style="min-height:64px;display:flex;align-items:center;gap:14px;padding:8px 12px;border:0;border-radius:14px;background:none;color:#ECE8E3;cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,0.04)">
            <sc-if value="{{ r.icon }}" hint-placeholder-val="{{ true }}"><div style="width:36px;height:36px;flex:none;border-radius:11px;background:#1E1C1B;display:flex;align-items:center;justify-content:center"><span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;overflow:hidden;color:{{ r.ic }}">{{ r.icon }}</span></div></sc-if>
            <sc-if value="{{ r.code }}" hint-placeholder-val="{{ false }}"><span style="flex:none;height:24px;padding:0 7px;border-radius:6px;background:rgba(255,107,118,0.12);color:#FF8F98;font:600 12px/24px 'JetBrains Mono',monospace">{{ r.code }}</span></sc-if>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
              <span style="font-family:{{ r.ff }};font-size:{{ r.fs }}px;font-weight:500;line-height:1.35"><sc-for list="{{ r.segs }}" as="s"><span style="{{ s.s }}">{{ s.t }}</span></sc-for></span>
              <span style="font-size:12.5px;line-height:1.35;color:#8C867F">{{ r.sub }}</span>
            </div>
            <span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;flex:none;overflow:hidden;color:#6E6862">chevron_right</span>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  inRef = React.createRef();
  state = { q: this.props.arg || '', f: 'all', ready: !!window.OxLib };
  componentDidMount() {
    if (!window.OxLib) { this._h = () => this.setState({ ready: true }); window.addEventListener('oxlib-ready', this._h); }
    if (!this.state.q) this._t = setTimeout(() => { const el = this.inRef.current; if (el) el.focus({ preventScroll: true }); }, 150);
  }
  componentWillUnmount() { clearTimeout(this._t); if (this._h) window.removeEventListener('oxlib-ready', this._h); }
  hl(text, q) {
    const i = q ? text.toLowerCase().indexOf(q.toLowerCase()) : -1;
    if (i < 0) return [{ k: 0, t: text, s: null }];
    return [{ k: 0, t: text.slice(0, i), s: null }, { k: 1, t: text.slice(i, i + q.length), s: { color: '#FF8A55', fontWeight: 650 } }, { k: 2, t: text.slice(i + q.length), s: null }].filter(x => x.t);
  }
  renderVals() {
    const L = window.OxLib, S = this.state, q = S.q.trim(), ql = q.toLowerCase();
    const nav = (s, o) => this.props.nav && this.props.nav(s, o), tab = (t) => this.props.tab && this.props.tab(t);
    const base = {
      inRef: this.inRef, q: S.q, hasQ: S.q.length > 0, onQ: (e) => this.setState({ q: e.target.value }),
      clearQ: () => { this.setState({ q: '' }); const el = this.inRef.current; if (el) el.focus({ preventScroll: true }); },
      goBack: () => this.props.back && this.props.back(),
      recent: ['borrow', 'E0382', 'lifetimes', 'match', 'Vec'].map(t => ({ k: t, t, pick: () => this.setState({ q: t }) }))
    };
    if (!L || !L.ERRS) return Object.assign(base, { idle: true, none: false, groups: [], filters: [] });
    const has = (s) => s.toLowerCase().indexOf(ql) >= 0, numeric = /^\d/.test(q);
    const book = [], secs = new Set();
    if (q) L.BOOK_TOC.forEach(c => {
      const app = c.n === 'A';
      if (!c.s.length) { if (has(c.t)) { book.push({ id: String(c.n), t: c.t, sub: 'Chapter ' + c.n + (c.project ? ' · project' : '') }); secs.add(String(c.n)); } return; }
      c.s.forEach((s, i) => {
        const id = (app ? 'A.' : c.n + '.') + (i + 1);
        if (has(s) || (numeric && !app && id.indexOf(q) === 0)) { book.push({ id, t: (app ? '' : id + ' ') + s, sub: app ? 'Appendix' : 'Chapter ' + c.n + ' · ' + c.t }); secs.add(id); }
      });
    });
    const rl = [];
    if (q) {
      L.RL.path.forEach(p => {
        if (p.t !== 'topic') return;
        if (has(p.name) || has(p.name.replace(/_/g, ' ')) || p.secs.some(s => secs.has(s))) rl.push({ k: p.name, t: p.name, sub: p.n + ' exercises' + (p.book ? ' · drills ' + p.book : ''), ex: false });
      });
      Object.keys(L.EX).forEach(k => { const ex = L.EX[k]; if (ex.rl && (has(ex.title) || has(ex.subtitle))) rl.push({ k, t: ex.title, sub: ex.subtitle, ex: true }); });
    }
    const errs = q ? Object.keys(L.ERRS).filter(c => has(c) || has(L.ERRS[c].t)) : [];
    const rowsB = book.map(b => ({ k: 'b' + b.id, icon: 'menu_book', ic: '#FF8A55', code: '', segs: this.hl(b.t, q), sub: b.sub, ff: "'Public Sans',sans-serif", fs: 15, go: () => b.id === '4.2' ? nav('reader', { variant: 'resume' }) : b.id === '1.2' ? nav('reader', { arg: '1.2' }) : tab('learn') }));
    const rowsR = rl.map(r => ({ k: 'r' + r.k, icon: 'data_object', ic: '#57D6C8', code: '', segs: this.hl(r.t, q), sub: r.sub, ff: "'JetBrains Mono',monospace", fs: 14.5, go: () => r.ex ? nav('workspace', { arg: r.k }) : tab('practice') }));
    const rowsE = errs.map(c => ({ k: 'e' + c, icon: '', ic: '', code: c, segs: this.hl(L.ERRS[c].t, q), sub: 'rustc --explain ' + c, ff: "'Public Sans',sans-serif", fs: 15, go: () => nav('terminal', { variant: 'cmd', arg: 'rustc --explain ' + c }) }));
    const G = [['book', 'THE BOOK', rowsB], ['rl', 'RUSTLINGS', rowsR], ['err', 'COMPILER ERRORS', rowsE]];
    const groups = G.filter(g => (S.f === 'all' || S.f === g[0]) && g[2].length).map(g => ({ k: g[0], t: g[1], n: g[2].length, rows: g[2] }));
    const total = rowsB.length + rowsR.length + rowsE.length;
    const filters = [['all', 'All', total], ['book', 'Book', rowsB.length], ['rl', 'Rustlings', rowsR.length], ['err', 'Errors', rowsE.length]].map(([k, t, n]) => {
      const on = S.f === k;
      return { k, t, n: q ? String(n) : '', pick: () => this.setState({ f: k }), bg: on ? 'rgba(247,76,0,0.16)' : 'transparent', bd: on ? 'rgba(247,76,0,0.5)' : '#3A3735', c: on ? '#FF8A55' : '#D9D3CC', nc: on ? '#FF8A55' : '#8C867F' };
    });
    return Object.assign(base, { idle: !q, none: !!q && groups.length === 0, groups, filters });
  }
}
</script>
</body>
</html>
