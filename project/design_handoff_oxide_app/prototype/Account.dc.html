<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=JetBrains+Mono:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
<style>body{margin:0}a{color:#FF8A55}a:hover{color:#FFA070}</style>
</helmet>
<div style="height:100%;display:flex;flex-direction:column;background:#0F0E0E;font-family:'Public Sans',sans-serif;color:#ECE8E3">
  <div style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px">
    <button onClick="{{ goBack }}" style="width:48px;height:48px;flex:none;border:0;background:none;border-radius:24px;color:#ECE8E3;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,0.06)"><span style="font:24px/1 'Material Symbols Outlined';width:24px;height:24px;overflow:hidden">arrow_back</span></button>
    <span style="font-size:20px;font-weight:600">Account</span>
  </div>
  <div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none">
    <div style="display:flex;flex-direction:column;gap:8px;padding:8px 16px 32px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 24px">
        <div style="width:88px;height:88px;border-radius:44px;background:#2C2A28;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600">{{ initial }}</div>
        <span style="font-size:13px;color:#A39C95">Learning Rust since July</span>
      </div>
      <label style="position:relative;display:block">
        <span style="position:absolute;left:12px;top:-8px;padding:0 4px;background:#0F0E0E;font-size:12px;color:{{ nameLc }}">Name</span>
        <input value="{{ name }}" onChange="{{ onName }}" onFocus="{{ onNf }}" onBlur="{{ onNb }}" autoComplete="name" style="width:100%;box-sizing:border-box;height:56px;border:0;outline:none;border-radius:8px;box-shadow:inset 0 0 0 {{ nameBw }} {{ nameBc }};background:transparent;color:#ECE8E3;font:400 16px 'Public Sans',sans-serif;padding:0 16px;caret-color:#F74C00">
      </label>
      <span style="padding:2px 16px 14px;font-size:12.5px;color:#8C867F">Shown on your profile.</span>
      <div style="min-height:64px;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:20px;background:#171615">
        <span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;flex:none;overflow:hidden;color:#D9D3CC">mail</span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:500">Email</span><span style="font-size:13px;color:#A39C95">sam@fastmail.com</span></div>
      </div>

      <span style="padding:16px 8px 4px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:0.09em;color:#A39C95">SIGN-IN</span>
      <div style="border-radius:20px;background:#171615;display:flex;flex-direction:column;overflow:hidden">
        <sc-for list="{{ signin }}" as="r" hint-placeholder-count="2">
          <button onClick="{{ r.onTap }}" style="min-height:64px;display:flex;align-items:center;gap:14px;padding:10px 16px;border:0;background:none;box-shadow:{{ r.line }};color:#ECE8E3;cursor:pointer;text-align:left">
            <span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;flex:none;overflow:hidden;color:{{ r.ic }}">{{ r.icon }}</span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:500">{{ r.t }}</span><span style="font-size:13px;line-height:1.4;color:#A39C95">{{ r.s }}</span></div>
            <span style="font:600 14px 'Public Sans',sans-serif;color:#FF8A55;white-space:nowrap">{{ r.act }}</span>
          </button>
        </sc-for>
      </div>

      <span style="padding:16px 8px 4px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:0.09em;color:#A39C95">YOUR DATA</span>
      <div style="border-radius:20px;background:#171615;display:flex;flex-direction:column;overflow:hidden">
        <sc-for list="{{ data }}" as="r" hint-placeholder-count="2">
          <button onClick="{{ r.onTap }}" style="min-height:64px;display:flex;align-items:center;gap:14px;padding:10px 16px;border:0;background:none;box-shadow:{{ r.line }};color:#ECE8E3;cursor:pointer;text-align:left">
            <span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;flex:none;overflow:hidden;color:{{ r.ic }}">{{ r.icon }}</span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:500">{{ r.t }}</span><span style="font-size:13px;line-height:1.4;color:#A39C95">{{ r.s }}</span></div>
            <span style="font:600 14px 'Public Sans',sans-serif;color:#FF8A55;white-space:nowrap">{{ r.act }}</span>
          </button>
        </sc-for>
      </div>

      <button onClick="{{ del }}" style="margin-top:20px;height:52px;border:0;border-radius:26px;background:none;box-shadow:inset 0 0 0 1px #3A3735;color:#FF8F98;font:600 15px 'Public Sans',sans-serif;cursor:pointer" style-hover="background:rgba(255,107,118,0.06)">Delete account</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: 'Sam', nf: false, sync: 0, g: false };
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const S = this.state, P = this.props, toast = (t) => P.toast && P.toast(t);
    const line = (i) => i ? 'inset 0 1px 0 rgba(255,255,255,0.05)' : 'none';
    const sync = () => { if (S.sync === 1) return; this.setState({ sync: 1 }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ sync: 2 }), 1200); };
    const signin = [
      { icon: 'check_circle', ic: '#57D6C8', t: 'GitHub', s: 'Connected as @samr', act: '', onTap: () => {} },
      { icon: S.g ? 'check_circle' : 'add_link', ic: S.g ? '#57D6C8' : '#D9D3CC', t: 'Google', s: S.g ? 'Connected' : 'Not connected', act: S.g ? '' : 'Connect', onTap: () => { if (!S.g) { this.setState({ g: true }); toast('Google connected'); } } }
    ].map((r, i) => Object.assign({ k: r.t, line: line(i) }, r));
    const data = [
      { icon: 'sync', ic: '#D9D3CC', t: 'Sync', s: ['Last synced 2 min ago', 'Syncing…', 'Synced just now'][S.sync], act: S.sync === 1 ? '' : 'Sync now', onTap: sync },
      { icon: 'download', ic: '#D9D3CC', t: 'Export my data', s: 'Progress and code as a .zip', act: 'Export', onTap: () => toast('Export saved to Downloads') }
    ].map((r, i) => Object.assign({ k: r.t, line: line(i) }, r));
    return {
      name: S.name, initial: (S.name.trim()[0] || 'S').toUpperCase(), onName: (e) => this.setState({ name: e.target.value }),
      onNf: () => this.setState({ nf: true }), onNb: () => this.setState({ nf: false }),
      nameBw: S.nf ? '2px' : '1px', nameBc: S.nf ? '#F74C00' : '#6E6862', nameLc: S.nf ? '#FF8A55' : '#A39C95',
      signin, data, goBack: () => P.back && P.back(), del: () => P.pop && P.pop('delacct')
    };
  }
}
</script>
</body>
</html>
