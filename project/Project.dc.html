<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=JetBrains+Mono:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
<style>body{margin:0}a{color:#FF8A55}a:hover{color:#FFA070}</style>
</helmet>
<div style="height:100%;display:flex;flex-direction:column;background:#0F0E0E;font-family:'Public Sans',sans-serif;color:#ECE8E3">
  <div style="height:56px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px">
    <button onClick="{{ goBack }}" style="width:48px;height:48px;flex:none;border:0;background:none;border-radius:24px;color:#ECE8E3;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,0.06)"><span style="font:24px/1 'Material Symbols Outlined';width:24px;height:24px;overflow:hidden">arrow_back</span></button>
    <span style="flex:1"></span>
    <sc-if value="{{ p.made }}" hint-placeholder-val="{{ false }}"><button onClick="{{ more }}" title="Delete project" style="width:48px;height:48px;flex:none;border:0;background:none;border-radius:24px;color:#D9D3CC;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,0.06)"><span style="font:24px/1 'Material Symbols Outlined';width:24px;height:24px;overflow:hidden">delete</span></button></sc-if>
  </div>
  <div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none">
    <div style="display:flex;flex-direction:column;gap:16px;padding:4px 16px 28px">
      <div style="display:flex;flex-direction:column;gap:10px;padding:0 4px">
        <span style="font:500 11px 'JetBrains Mono',monospace;letter-spacing:0.09em;color:#A39C95">{{ p.kicker }}</span>
        <span style="font:600 30px/1.1 'JetBrains Mono',monospace;letter-spacing:-0.02em">{{ p.name }}</span>
        <span style="font-size:15.5px;line-height:1.55;color:#C9C2BA;text-wrap:pretty">{{ p.about }}</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:4px">
          <span style="height:28px;padding:0 10px;border-radius:14px;background:{{ p.sbg }};color:{{ p.sc }};font:600 12.5px/28px 'Public Sans',sans-serif">{{ p.status }}</span>
          <span style="height:28px;padding:0 10px;border-radius:14px;background:#1E1C1B;color:#C9C2BA;font:500 12.5px/28px 'Public Sans',sans-serif">{{ p.meta }}</span>
        </div>
      </div>
      <sc-if value="{{ p.pre }}" hint-placeholder-val="{{ false }}">
        <div style="padding:14px 16px;border-radius:18px;background:#171615;display:flex;gap:12px">
          <span style="font:20px/1 'Material Symbols Outlined';width:20px;height:20px;flex:none;overflow:hidden;color:#F2C25B">info</span>
          <span style="font-size:14px;line-height:1.5;color:#D9D3CC;text-wrap:pretty">{{ p.pre }}</span>
        </div>
      </sc-if>
      <div style="border-radius:20px;background:#171615;display:flex;flex-direction:column;padding:8px 0">
        <span style="padding:8px 16px 6px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:0.09em;color:#A39C95">IN THE BOOK</span>
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
          <button onClick="{{ s.go }}" style="min-height:64px;display:flex;align-items:center;gap:14px;padding:8px 16px;border:0;background:none;color:#ECE8E3;cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,0.03)">
            <span style="width:28px;height:28px;flex:none;border-radius:14px;background:{{ s.bg }};box-shadow:{{ s.ring }};display:flex;align-items:center;justify-content:center;font:600 12px 'JetBrains Mono',monospace;color:{{ s.nc }}">{{ s.n }}</span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
              <span style="font-size:15px;font-weight:500;line-height:1.35;text-wrap:pretty">{{ s.t }}</span>
              <span style="font:400 12px 'JetBrains Mono',monospace;color:#8C867F">{{ s.sub }}</span>
            </div>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{ p.made }}" hint-placeholder-val="{{ false }}">
        <div style="border-radius:20px;background:#171615;display:flex;flex-direction:column;padding:8px 0">
          <span style="padding:8px 16px 6px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:0.09em;color:#A39C95">FILES</span>
          <sc-for list="{{ files }}" as="f" hint-placeholder-count="2">
            <button onClick="{{ f.go }}" style="min-height:56px;display:flex;align-items:center;gap:14px;padding:6px 16px;border:0;background:none;color:#ECE8E3;cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,0.03)">
              <span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;flex:none;overflow:hidden;color:#A39C95">{{ f.icon }}</span>
              <span style="flex:1;font:500 14.5px 'JetBrains Mono',monospace">{{ f.name }}</span>
              <span style="font:600 13.5px 'Public Sans',sans-serif;color:#FF8A55">Edit</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>
  <div style="flex:none;display:flex;flex-direction:column;padding:12px 20px 14px;box-shadow:inset 0 1px 0 #1C1A19">
    <button onClick="{{ p.cta }}" style="height:56px;border:0;border-radius:28px;background:#F74C00;color:#1A0B04;font:650 16.5px 'Public Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer" style-hover="background:#FF5A10"><span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;overflow:hidden">terminal</span>{{ p.ctaLabel }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static PROJ = {
    guessing_game: { ch: 2, done: true, about: 'A command-line game. The program picks a number from 1 to 100 and you guess until you get it.', pre: '', steps: [['Setting Up a New Project', 'cargo new guessing_game'], ['Processing a Guess', 'Read input with io::stdin'], ['Generating a Secret Number', 'Add the rand crate'], ['Comparing the Guess to the Secret Number', 'match on Ordering'], ['Allowing Multiple Guesses with Looping', 'loop, continue and break']] },
    minigrep: { ch: 12, done: false, about: 'A small version of grep. It searches a file for a string and prints every line that contains it.', pre: 'Uses modules, collections, error handling, traits and tests from chapters 7 to 11. You’re on chapter 4, so you may want those first.', steps: [['Accepting Command Line Arguments', 'std::env::args'], ['Reading a File', 'fs::read_to_string'], ['Refactoring to Improve Modularity and Error Handling', 'Move logic to lib.rs, return Result'], ['Adding Functionality with Test Driven Development', 'Write search test-first'], ['Working with Environment Variables', 'IGNORE_CASE for case-insensitive search'], ['Redirecting Errors to Standard Error', 'eprintln!']] },
    hello: { ch: 21, done: false, about: 'A web server that answers browser requests with HTML, then handles them on a pool of threads.', pre: 'Builds on threads and message passing from chapter 16. You’re on chapter 4, so you may want those first.', steps: [['Building a Single-Threaded Web Server', 'TcpListener and TcpStream'], ['From Single-Threaded to Multithreaded Server', 'Build a ThreadPool'], ['Graceful Shutdown and Cleanup', 'Implement Drop to join threads']] }
  };
  term() { return window.__oxTerm && window.__oxTerm[this.props.sid]; }
  store() { const W = window.__oxP = window.__oxP || {}, k = this.props.sid || 'x'; return W[k] = W[k] || { files: {}, deleted: {} }; }
  made(name) {
    const T = this.term(), fresh = this.props.fresh === true || this.props.fresh === 'true';
    if (T) return !!T.st.fs['~/projects/' + name];
    if (this.store().deleted[name]) return false;
    return name === 'guessing_game' && !fresh;
  }
  del(name) {
    const Pst = this.store(), T = this.term(), r = '~/projects/' + name;
    Pst.deleted[name] = true; delete Pst.files[name];
    if (T) {
      const fs = T.st.fs;
      Object.keys(fs).forEach(p => { if (p === r || p.indexOf(r + '/') === 0) delete fs[p]; });
      if (fs['~/projects']) fs['~/projects'].d = fs['~/projects'].d.filter(x => x !== name);
      if (T.st.cwd === r || T.st.cwd.indexOf(r + '/') === 0) T.st = Object.assign({}, T.st, { cwd: '~/projects' });
    }
    if (this.props.back) this.props.back();
  }
  renderVals() {
    const P = this.props, name = Component.PROJ[P.arg] ? P.arg : 'minigrep', D = Component.PROJ[name];
    const fresh = P.fresh === true || P.fresh === 'true', made = this.made(name), done = made && D.done && !fresh, r = '~/projects/' + name;
    const nav = (s, o) => P.nav && P.nav(s, o), tab = (t) => P.tab && P.tab(t);
    const st = done ? ['Done', 'rgba(87,214,200,0.14)', '#57D6C8'] : made ? ['In progress', 'rgba(247,76,0,0.14)', '#FF8A55'] : ['Not started', '#1E1C1B', '#C9C2BA'];
    const steps = D.steps.map((s, i) => ({ k: i, n: String(i + 1), t: s[0], sub: (D.ch === 2 ? '' : D.ch + '.' + (i + 1) + ' · ') + s[1], bg: done ? '#57D6C8' : 'transparent', ring: done ? 'none' : 'inset 0 0 0 1.5px #3A3735', nc: done ? '#06201C' : '#A39C95', go: () => tab('learn') }));
    const files = [['src/main.rs', 'description'], ['Cargo.toml', 'settings']].map(([f, icon]) => ({ k: f, name: f, icon, go: () => nav('editor', { arg: name, variant: f }) }));
    return {
      p: {
        name, made, kicker: 'CHAPTER ' + D.ch + ' · PROJECT', about: D.about, status: st[0], sbg: st[1], sc: st[2], pre: made ? '' : D.pre,
        meta: D.steps.length + (D.ch === 2 ? ' parts' : ' sections'), ctaLabel: made ? 'Open in the Terminal' : 'Create ' + name,
        cta: () => nav('terminal', { variant: 'cmd', arg: made ? 'cd ' + r : 'cd ~/projects && cargo new ' + name })
      },
      steps, files, goBack: () => P.back && P.back(),
      more: () => P.pop && P.pop('delproj', { name, onDelete: () => this.del(name) })
    };
  }
}
</script>
</body>
</html>
