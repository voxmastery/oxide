<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=JetBrains+Mono:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
<style>body{margin:0;background:#1B1A19}a{color:#FF7A3D;text-decoration:none}a:hover{color:#FFA070}</style>
</helmet>
<div style="width:412px;height:915px;border-radius:34px;overflow:hidden;background:#0F0E0E;display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,0.09),0 30px 80px rgba(0,0,0,0.45);font-family:'Public Sans',sans-serif;color:#ECE8E3;-webkit-font-smoothing:antialiased">
  <div style="height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 28px;font:500 14px/1 'Public Sans',sans-serif;color:#ECE8E3;background:#0F0E0E">
    <span style="font-variant-numeric:tabular-nums">21:14</span>
    <div style="display:flex;gap:7px;align-items:center">
      <span style="font:17px/1 'Material Symbols Outlined';width:17px;height:17px;overflow:hidden;font-variation-settings:'FILL' 1">{{ netIcon }}</span>
      <span style="font:17px/1 'Material Symbols Outlined';width:17px;height:17px;overflow:hidden;font-variation-settings:'FILL' 1">signal_cellular_alt</span>
      <div style="width:24px;height:12px;border-radius:4px;border:1.5px solid currentColor;padding:1.5px;box-sizing:border-box;display:flex"><div style="width:74%;border-radius:1.5px;background:currentColor"></div></div>
    </div>
  </div>
  <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
    <div style="flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 18px;background:#221E18;border-bottom:1px solid rgba(242,194,91,0.16)">
      <span style="font:18px/1 'Material Symbols Outlined';width:18px;height:18px;overflow:hidden;color:#F2C25B">cloud_off</span>
      <span style="flex:1;font-size:13px;line-height:1.35;color:#E2DBD2">Offline. The Book, exercises and your local toolchain still work.</span>
    </div>
  </sc-if>
  <div style="flex:1;position:relative;min-height:0">
    <sc-if value="{{ is.home }}" hint-placeholder-val="{{ false }}"><dc-import name="Home" variant="{{ cur.variant }}" nav="{{ nav }}" tab="{{ tab }}" offline="{{ offline }}" rl="true" fresh="{{ fresh }}" marks="{{ marks }}" pop="{{ pop }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.ws }}" hint-placeholder-val="{{ false }}"><dc-import name="Workspace" variant="{{ cur.variant }}" arg="{{ cur.arg }}" nav="{{ nav }}" back="{{ back }}" rl="true" pop="{{ pop }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.learn }}" hint-placeholder-val="{{ false }}"><dc-import name="Book" nav="{{ nav }}" tab="{{ tab }}" fresh="{{ fresh }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.reader }}" hint-placeholder-val="{{ false }}"><dc-import name="Reader" variant="{{ cur.variant }}" arg="{{ cur.arg }}" nav="{{ nav }}" back="{{ back }}" tab="{{ tab }}" mark="{{ mark }}" pop="{{ pop }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.practice }}" hint-placeholder-val="{{ false }}"><dc-import name="Practice" nav="{{ nav }}" tab="{{ tab }}" fresh="{{ fresh }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.onb }}" hint-placeholder-val="{{ false }}"><dc-import name="Onboarding" variant="{{ cur.variant }}" finish="{{ finish }}" sid="{{ sid }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.term }}" hint-placeholder-val="{{ false }}"><dc-import name="Terminal" variant="{{ cur.variant }}" arg="{{ cur.arg }}" nav="{{ nav }}" back="{{ back }}" tab="{{ tab }}" depth="{{ depth }}" fresh="{{ fresh }}" mark="{{ mark }}" pop="{{ pop }}" sid="{{ sid }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.prof }}" hint-placeholder-val="{{ false }}"><dc-import name="Profile" nav="{{ nav }}" tab="{{ tab }}" fresh="{{ fresh }}" pop="{{ pop }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.set }}" hint-placeholder-val="{{ false }}"><dc-import name="Settings" nav="{{ nav }}" back="{{ back }}" fresh="{{ fresh }}" pop="{{ pop }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.search }}" hint-placeholder-val="{{ false }}"><dc-import name="Search" arg="{{ cur.arg }}" nav="{{ nav }}" back="{{ back }}" tab="{{ tab }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.acc }}" hint-placeholder-val="{{ false }}"><dc-import name="Account" nav="{{ nav }}" back="{{ back }}" pop="{{ pop }}" toast="{{ toast }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.proj }}" hint-placeholder-val="{{ false }}"><dc-import name="Project" arg="{{ cur.arg }}" nav="{{ nav }}" back="{{ back }}" tab="{{ tab }}" pop="{{ pop }}" sid="{{ sid }}" fresh="{{ fresh }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.ed }}" hint-placeholder-val="{{ false }}"><dc-import name="Editor" arg="{{ cur.arg }}" variant="{{ cur.variant }}" from="{{ cur.from }}" nav="{{ nav }}" back="{{ back }}" sid="{{ sid }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import></sc-if>
  </div>
  <sc-if value="{{ showNav }}" hint-placeholder-val="{{ false }}">
    <nav style="flex:none;height:80px;display:flex;background:#161514;padding:0 4px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
        <button onClick="{{ t.onTap }}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;padding:0;cursor:pointer">
          <div style="width:60px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:{{ t.ind }};transition:background 200ms">
            <span style="font:24px/1 'Material Symbols Outlined';width:24px;height:24px;overflow:hidden;color:{{ t.ic }};font-variation-settings:{{ t.fill }}">{{ t.icon }}</span>
          </div>
          <span style="font-family:'Public Sans',sans-serif;font-size:12px;letter-spacing:0.01em;color:{{ t.lc }};font-weight:{{ t.fw }}">{{ t.label }}</span>
        </button>
      </sc-for>
    </nav>
  </sc-if>
  <div style="height:22px;flex:none;display:flex;align-items:center;justify-content:center;background:{{ bottom }}"><div style="width:108px;height:4px;border-radius:2px;background:rgba(255,255,255,0.42)"></div></div>
  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:12px;right:12px;bottom:{{ toastB }}px;z-index:40;min-height:48px;border-radius:6px;background:#ECE8E3;color:#1F1D1B;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 16px;box-shadow:0 4px 14px rgba(0,0,0,0.4)">
      <span style="flex:1;padding:10px 0;font-size:14px;line-height:1.4">{{ toastText }}</span>
      <sc-if value="{{ toastAct }}" hint-placeholder-val="{{ false }}"><button onClick="{{ toastGo }}" style="height:40px;padding:0 12px;border:0;border-radius:20px;background:none;color:#A8360A;font:650 14px 'Public Sans',sans-serif;cursor:pointer">{{ toastAct }}</button></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ popOn }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:{{ popTop }}px;left:0;right:0;bottom:0;z-index:60;pointer-events:{{ popPe }}">
      <dc-import name="Overlays" kind="{{ popKind }}" opts="{{ popOpts }}" close="{{ closePop }}" pop="{{ pop }}" nav="{{ nav }}" tab="{{ tab }}" toast="{{ toast }}" sid="{{ sid }}" style="position:absolute;top:0;left:0;right:0;bottom:0" hint-size="100%,100%"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { stack: [{ screen: this.props.screen || 'home', variant: this.props.variant || '', arg: this.props.arg || '' }], fresh: this.props.fresh === true || this.props.fresh === 'true', marks: {}, pop: this.props.popup ? { kind: this.props.popup, opts: {} } : null, toast: this.props.toast ? { text: this.props.toast, action: this.props.toastAction || '' } : null };
  static SCREENS = { home: 'home', workspace: 'ws', learn: 'learn', reader: 'reader', practice: 'practice', onboarding: 'onb', terminal: 'term', profile: 'prof', settings: 'set', search: 'search', account: 'acc', project: 'proj', editor: 'ed' };
  static TAB_OF = { home: 'home', learn: 'learn', reader: 'learn', search: 'learn', practice: 'practice', workspace: 'practice', project: 'practice', terminal: 'terminal', editor: 'terminal', profile: 'profile', settings: 'profile', account: 'profile' };
  static TABS = [
    { id: 'home', icon: 'home', label: 'Home' },
    { id: 'learn', icon: 'menu_book', label: 'Learn' },
    { id: 'practice', icon: 'data_object', label: 'Practice' },
    { id: 'terminal', icon: 'terminal', label: 'Terminal' },
    { id: 'profile', icon: 'person', label: 'Profile' }
  ];
  static FULL = { mission: 1, 'mission-day1': 1, levelup: 1 };
  sid = 'p' + Math.random().toString(36).slice(2, 9);
  nav = (screen, opts = {}) => this.setState(s => ({ pop: null, stack: [...s.stack, { screen, variant: '', arg: '', ...opts }] }));
  back = () => this.setState(s => {
    if (s.stack.length > 1) return { pop: null, stack: s.stack.slice(0, -1) };
    return { pop: null, stack: [{ screen: Component.TAB_OF[s.stack[0].screen] || 'home', variant: '' }] };
  });
  tab = (id) => this.setState({ pop: null, stack: [{ screen: id, variant: '' }] });
  pop = (kind, opts) => this.setState({ pop: kind ? { kind, opts: opts || {} } : null });
  closePop = () => this.setState({ pop: null });
  toast = (text, action, onAction) => { clearTimeout(this._tt); this.setState({ toast: { text, action: action || '', onAction } }); this._tt = setTimeout(() => this.setState({ toast: null }), 4000); };
  toastGo = () => { const t = this.state.toast; clearTimeout(this._tt); this.setState({ toast: null }); if (t && t.onAction) t.onAction(); };
  finish = (fresh) => this.setState({ fresh: !!fresh, marks: {}, stack: [{ screen: 'home', variant: '' }] });
  mark = (k) => this.setState(s => s.marks[k] ? null : { marks: Object.assign({}, s.marks, { [k]: true }) });
  componentWillUnmount() { clearTimeout(this._tt); }
  renderVals() {
    const S = this.state, C = Component, cur = S.stack[S.stack.length - 1];
    const sc = C.SCREENS[cur.screen] ? cur.screen : 'home', key = C.SCREENS[sc];
    const is = {}; Object.keys(C.SCREENS).forEach(n => { is[C.SCREENS[n]] = C.SCREENS[n] === key; });
    const active = C.TAB_OF[sc], showNav = ['home', 'learn', 'practice', 'terminal', 'profile'].indexOf(sc) >= 0;
    const tabs = C.TABS.map(t => {
      const on = t.id === active;
      return Object.assign({}, t, { onTap: () => this.tab(t.id), ind: on ? 'rgba(247,76,0,0.2)' : 'transparent', ic: on ? '#FF8A55' : '#A8A19A', fill: on ? "'FILL' 1" : "'FILL' 0", lc: on ? '#F1EDE8' : '#A8A19A', fw: on ? 600 : 500 });
    });
    const offline = this.props.offline === true || this.props.offline === 'true';
    return {
      cur, is, tabs, showNav, offline, fresh: S.fresh, marks: S.marks, depth: S.stack.length, finish: this.finish, mark: this.mark, netIcon: offline ? 'wifi_off' : 'wifi',
      pop: this.pop, toast: this.toast, closePop: this.closePop, sid: this.sid,
      popOn: !!S.pop, popKind: S.pop ? S.pop.kind : '', popOpts: S.pop ? S.pop.opts : {}, popTop: S.pop && C.FULL[S.pop.kind] ? 36 : 0, popPe: S.pop && S.pop.kind === 'push' ? 'none' : 'auto',
      toastOn: !!S.toast, toastText: S.toast ? S.toast.text : '', toastAct: S.toast ? S.toast.action : '', toastGo: this.toastGo, toastB: showNav ? 114 : 40,
      bottom: showNav || sc === 'workspace' ? '#161514' : '#0F0E0E',
      nav: this.nav, back: this.back, tab: this.tab
    };
  }
}
</script>
</body>
</html>
