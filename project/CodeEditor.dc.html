<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=JetBrains+Mono:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
<script src="oxide-lib.js"></script>
<style>body{margin:0}textarea::selection{background:rgba(247,76,0,0.38)}@keyframes ox-blink{50%{opacity:0}}</style>
</helmet>
<div style="height:100%;display:flex;flex-direction:column;background:{{ bg }};min-height:0;position:relative">
  <div ref="{{ scrollRef }}" style="flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3A3735 transparent">
    <div style="display:flex;min-width:max-content;min-height:100%;padding-top:10px;padding-bottom:{{ padB }}px;box-sizing:border-box">
      <div style="position:sticky;left:0;z-index:2;flex:none;width:44px;background:{{ bg }};font:400 12px/21px 'JetBrains Mono',monospace;user-select:none">
        <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="24">
          <div style="height:21px;position:relative;text-align:right;padding-right:12px;color:{{ ln.gc }};background:{{ ln.bg }}"><span style="position:absolute;left:9px;top:7.5px;width:6px;height:6px;border-radius:50%;background:{{ ln.dot }}"></span>{{ ln.n }}</div>
        </sc-for>
      </div>
      <div style="position:relative;flex:1 0 auto;padding:0 24px 0 4px">
        <div style="font:400 13px/21px 'JetBrains Mono',monospace;font-variant-ligatures:none;tab-size:4">
          <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="24"><div style="height:21px;white-space:pre;background:{{ ln.bg }}"><sc-for list="{{ ln.toks }}" as="t"><span style="{{ t.s }}">{{ t.t }}</span></sc-for></div></sc-for>
        </div>
        <sc-if value="{{ fakeCaret }}" hint-placeholder-val="{{ false }}">{{ fakeCaret }}</sc-if>
        <textarea ref="{{ taRef }}" value="{{ code }}" onChange="{{ onInput }}" onKeyDown="{{ onKey }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" onSelect="{{ onSel }}" readOnly="{{ ro }}" spellCheck="false" autoCapitalize="off" autoComplete="off" autoCorrect="off" wrap="off" style="position:absolute;top:0;left:4px;right:24px;bottom:0;margin:0;padding:0;border:0;outline:none;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:{{ th.caret }};font:400 13px/21px 'JetBrains Mono',monospace;white-space:pre;font-variant-ligatures:none;tab-size:4"></textarea>
      </div>
    </div>
  </div>
  <sc-if value="{{ showKbd }}" hint-placeholder-val="{{ false }}">
    <div style="flex:none;background:{{ th.kbBg }};border-top:1px solid {{ th.line }};font-family:'Public Sans',sans-serif">
      <div style="height:52px;display:flex;align-items:center">
        <div style="flex:1;min-width:0;overflow-x:auto;display:flex;align-items:center;gap:4px;padding:0 4px 0 6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)">
          <sc-for list="{{ keys }}" as="k" hint-placeholder-count="10">
            <button onMouseDown="{{ k.down }}" style="flex:none;min-width:40px;height:40px;padding:0 9px;border-radius:9px;border:0;background:{{ th.key }};color:{{ th.fg }};box-shadow:{{ th.shadow }};font:500 15px/1 'JetBrains Mono',monospace;cursor:pointer;font-variant-ligatures:none" style-active="background:#8C867F">{{ k.label }}</button>
          </sc-for>
        </div>
        <div style="flex:none;display:flex;align-items:center;gap:2px;padding:0 6px 0 6px;border-left:1px solid {{ th.line }};height:34px">
          <button onMouseDown="{{ tabDown }}" title="Tab" style="width:44px;height:44px;border:0;border-radius:10px;background:none;color:{{ th.fg }};cursor:pointer;display:flex;align-items:center;justify-content:center" style-active="background:#3A3735"><span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;overflow:hidden">keyboard_tab</span></button>
          <button onMouseDown="{{ undoDown }}" title="Undo" style="width:44px;height:44px;border:0;border-radius:10px;background:none;color:{{ undoC }};cursor:pointer;display:flex;align-items:center;justify-content:center" style-active="background:#3A3735"><span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;overflow:hidden">undo</span></button>
          <button onMouseDown="{{ redoDown }}" title="Redo" style="width:44px;height:44px;border:0;border-radius:10px;background:none;color:{{ redoC }};cursor:pointer;display:flex;align-items:center;justify-content:center" style-active="background:#3A3735"><span style="font:22px/1 'Material Symbols Outlined';width:22px;height:22px;overflow:hidden">redo</span></button>
        </div>
      </div>
      <div style="padding:6px 4px 8px;display:flex;flex-direction:column;gap:9px;background:{{ th.kbBg }}">
        <sc-for list="{{ kbRows }}" as="row" hint-placeholder-count="4">
          <div style="display:flex;gap:5px;padding:0 {{ row.pad }}px">
            <sc-for list="{{ row.keys }}" as="k">
              <button onMouseDown="{{ k.down }}" style="flex:{{ k.flex }};min-width:0;height:44px;border:0;border-radius:8px;background:{{ k.bg }};color:{{ th.fg }};box-shadow:{{ th.shadow }};font:400 {{ k.fs }}px/1 'Public Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-active="background:#5A5653"><span style="font-family:{{ k.ff }};font-size:{{ k.fs }}px;line-height:1">{{ k.label }}</span></button>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { focused: false, curLine: 0, shift: false, ready: !!window.OxLib };
  taRef = React.createRef();
  scrollRef = React.createRef();
  undoStack = []; redoStack = []; lastPush = 0; pendingSel = null;
  static PAIRS = { '{': '}', '(': ')', '[': ']', '"': '"' };
  componentDidMount() {
    if (!window.OxLib) { this._h = () => this.setState({ ready: true }); window.addEventListener('oxlib-ready', this._h); }
    this.placeCaret();
    setTimeout(() => this.scrollTo(), 60);
    if (this.props.autoFocus) setTimeout(() => { const ta = this.taRef.current; if (ta) { ta.focus({ preventScroll: true }); this.placeCaret(); } }, 30);
  }
  componentWillUnmount() { if (this._h) window.removeEventListener('oxlib-ready', this._h); }
  componentDidUpdate(prev) {
    const ta = this.taRef.current;
    if (ta && this.pendingSel != null) { ta.selectionStart = ta.selectionEnd = this.pendingSel; this.pendingSel = null; }
    if (prev && prev.caret !== this.props.caret) this.placeCaret();
    if (prev && prev.scrollLine !== this.props.scrollLine) this.scrollTo();
  }
  scrollTo() {
    const el = this.scrollRef.current, n = Number(this.props.scrollLine);
    if (el && n) el.scrollTo({ top: Math.max(0, (n - 8) * 21), behavior: 'smooth' });
  }
  caretOffset() {
    const c = this.props.caret, code = this.props.code || '';
    if (!c) return null;
    const ls = code.split('\n'); let off = 0;
    for (let i = 0; i < c.line - 1 && i < ls.length; i++) off += ls[i].length + 1;
    return off + c.col - 1;
  }
  placeCaret() {
    const ta = this.taRef.current, off = this.caretOffset();
    if (ta && off != null) { ta.selectionStart = ta.selectionEnd = off; }
  }
  code() { return this.props.code || ''; }
  emit(nv, sel, force) {
    const v = this.code(), now = Date.now();
    if (force || now - this.lastPush > 600) { this.undoStack.push(v); if (this.undoStack.length > 200) this.undoStack.shift(); }
    this.lastPush = now; this.redoStack = [];
    this.pendingSel = sel;
    this.props.onChange && this.props.onChange(nv);
  }
  ta() { return this.taRef.current; }
  insertText(text) {
    const ta = this.ta(); if (!ta || this.props.readOnly) return;
    const v = this.code(), s = ta.selectionStart, e = ta.selectionEnd, P = Component.PAIRS;
    if ((text === ')' || text === '}' || text === ']') && s === e && v[s] === text) { ta.selectionStart = ta.selectionEnd = s + 1; return; }
    let ins = text, back = 0;
    if (P[text] && s === e) { ins = text + P[text]; back = 1; }
    else if (P[text] && s !== e) { ins = text + v.slice(s, e) + P[text]; }
    if (this.state.shift && /^[a-z]$/.test(text)) { ins = text.toUpperCase(); this.setState({ shift: false }); }
    this.emit(v.slice(0, s) + ins + v.slice(e), s + ins.length - back, ins.length > 1);
  }
  newline() {
    const ta = this.ta(); if (!ta || this.props.readOnly) return;
    const v = this.code(), s = ta.selectionStart, e = ta.selectionEnd;
    const ls = v.lastIndexOf('\n', s - 1) + 1, indent = v.slice(ls).match(/^ */)[0];
    const prev = v[s - 1], next = v[e];
    let ins, sel;
    if (prev === '{' && next === '}') { ins = '\n' + indent + '    \n' + indent; sel = s + indent.length + 5; }
    else { ins = '\n' + indent + (prev === '{' ? '    ' : ''); sel = s + ins.length; }
    this.emit(v.slice(0, s) + ins + v.slice(e), sel, true);
  }
  backspace() {
    const ta = this.ta(); if (!ta || this.props.readOnly) return;
    const v = this.code(), s = ta.selectionStart, e = ta.selectionEnd;
    if (s !== e) return this.emit(v.slice(0, s) + v.slice(e), s);
    if (!s) return;
    const pair = Component.PAIRS[v[s - 1]] === v[s];
    this.emit(v.slice(0, s - 1) + v.slice(s + (pair ? 1 : 0)), s - 1);
  }
  undo = () => {
    if (!this.undoStack.length) return;
    this.redoStack.push(this.code());
    this.lastPush = 0;
    this.props.onChange && this.props.onChange(this.undoStack.pop());
  };
  redo = () => {
    if (!this.redoStack.length) return;
    this.undoStack.push(this.code());
    this.props.onChange && this.props.onChange(this.redoStack.pop());
  };
  onInput = (e) => this.emit(e.target.value, e.target.selectionStart);
  onKey = (e) => {
    if (e.key === 'Tab') { e.preventDefault(); this.insertText('    '); }
    else if (e.key === 'Enter') { e.preventDefault(); this.newline(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? this.redo() : this.undo(); }
    else if (!e.ctrlKey && !e.metaKey && (Component.PAIRS[e.key] || ')}]'.includes(e.key)) && e.key.length === 1) { e.preventDefault(); this.insertText(e.key); }
  };
  onFocus = () => { this.setState({ focused: true }); if (this.props.onKbd) this.props.onKbd(true); };
  onBlur = () => { this.setState({ focused: false }); if (this.props.onKbd) this.props.onKbd(false); };
  onSel = (e) => {
    const t = e.target, line = t.value.slice(0, t.selectionStart).split('\n').length;
    if (line !== this.state.curLine) this.setState({ curLine: line });
  };
  press(fn) { return (e) => { e.preventDefault(); fn(); }; }
  renderVals() {
    const L = window.OxLib, code = this.code();
    const marks = this.props.marks || [];
    const { focused, curLine } = this.state;
    const paper = this.props.theme === 'paper';
    const th = paper
      ? { caret: '#A8360A', kbBg: '#E6DFD2', line: 'rgba(0,0,0,0.08)', key: '#FFFDF8', spec: '#D3CBBD', fg: '#221D18', shadow: '0 1px 0 rgba(0,0,0,0.12)', dim: '#A39A8E', cur: '#3A332C', curBg: 'rgba(0,0,0,0.035)' }
      : { caret: '#FF7A3D', kbBg: '#1C1B1A', line: 'rgba(255,255,255,0.08)', key: '#2E2C2A', spec: '#2A2826', fg: '#F0ECE7', shadow: 'none', dim: '#5C5752', cur: '#D6D0C9', curBg: 'rgba(255,255,255,0.035)' };
    const MC = paper ? { err: '#C42B3A', warn: '#8F6200', run: '#C25A00' } : { err: '#FF6B76', warn: '#F2C25B', run: '#FFA14A' };
    const MB = paper ? { err: 'rgba(196,43,58,0.07)', warn: 'rgba(143,98,0,0.07)', run: 'rgba(194,90,0,0.08)' } : { err: 'rgba(255,107,118,0.08)', warn: 'rgba(242,194,91,0.07)', run: 'rgba(255,161,74,0.08)' };
    const lines = L ? L.highlight(code, { marks, light: paper }).map(ln => {
      const cur = focused && ln.n === curLine;
      return { ...ln, gc: ln.mark ? MC[ln.mark] : cur ? th.cur : th.dim, dot: ln.mark ? MC[ln.mark] : 'transparent', bg: ln.mark ? MB[ln.mark] : cur ? th.curBg : 'transparent' };
    }) : [];
    const kbd = this.props.kbd || 'never';
    const showKbd = kbd === 'always' || (kbd === 'auto' && focused);
    const SYM = ['{', '}', '(', ')', '[', ']', '<', '>', ';', ':', '&', '*', "'", '"', '!', '?', '|', '=>', '->', '::'];
    const keys = SYM.map(k => ({ label: k, down: this.press(() => this.insertText(k)) }));
    const letter = (c) => ({ label: this.state.shift ? c.toUpperCase() : c, flex: '1', bg: paper ? th.key : '#3A3836', fs: 20, ff: "'Public Sans',sans-serif", down: this.press(() => this.insertText(c)) });
    const special = (label, fn, flex, icon) => ({ label, flex, bg: th.spec, fs: icon ? 22 : 15, ff: icon ? "'Material Symbols Outlined'" : "'Public Sans',sans-serif", down: this.press(fn) });
    const kbRows = [
      { pad: 0, keys: 'qwertyuiop'.split('').map(letter) },
      { pad: 18, keys: 'asdfghjkl'.split('').map(letter) },
      { pad: 0, keys: [special('shift', () => this.setState(s => ({ shift: !s.shift })), '1.5', true), ...'zxcvbnm'.split('').map(letter), special('backspace', () => this.backspace(), '1.5', true)] },
      { pad: 0, keys: [special('?123', () => {}, '1.5'), special(',', () => this.insertText(','), '1'), { ...special('space_bar', () => this.insertText(' '), '5', true), bg: paper ? th.key : '#3A3836' }, special('.', () => this.insertText('.'), '1'), { ...special('keyboard_return', () => this.newline(), '1.5', true), bg: paper ? '#C9BFAE' : '#4A4643' }] }
    ];
    let fakeCaret = null;
    const c = this.props.caret;
    if (c && !focused && kbd === 'always') {
      fakeCaret = React.createElement('div', { style: { position: 'absolute', left: (4 + (c.col - 1) * 7.8) + 'px', top: ((c.line - 1) * 21 + 2) + 'px', width: '2px', height: '17px', borderRadius: '1px', background: th.caret, animation: 'ox-blink 1.05s steps(1) infinite', pointerEvents: 'none' } });
    }
    return {
      lines, code, showKbd, keys, kbRows, fakeCaret, th,
      bg: this.props.bg || '#0F0E0E',
      padB: Number(this.props.padBottom) || 24,
      ro: !!this.props.readOnly,
      undoC: this.undoStack.length ? th.fg : th.dim,
      redoC: this.redoStack.length ? th.fg : th.dim,
      taRef: this.taRef, scrollRef: this.scrollRef,
      onInput: this.onInput, onKey: this.onKey, onFocus: this.onFocus, onBlur: this.onBlur, onSel: this.onSel,
      tabDown: this.press(() => this.insertText('    ')),
      undoDown: this.press(this.undo), redoDown: this.press(this.redo)
    };
  }
}
</script>
</body>
</html>
